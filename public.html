<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterEnginy · Pantalla del públic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#f3f4f7;background:#101116;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;padding:clamp(20px,4vw,64px)}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;color:#d5c4ff;font-weight:700;font-size:24px}
button{background:#282a34;color:inherit;border:1px solid #555;border-radius:10px;padding:10px;cursor:pointer}
button:focus-visible{outline:3px solid #d5c4ff}
main{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
#phase{color:#d5c4ff;text-transform:uppercase;letter-spacing:3px;font-size:clamp(16px,2vw,26px)}
h1{font-size:clamp(32px,5vw,76px);margin:20px 0;overflow-wrap:anywhere}
#detail{color:#bfc0ce;font-size:clamp(18px,2vw,26px)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:30px 0}
article{border:3px solid #383a49;border-radius:24px;padding:clamp(20px,4vw,60px);background:#191a22;min-width:0}
article span{font-size:18px;color:#bfc0ce}
h2{font-size:clamp(28px,4vw,60px);overflow-wrap:anywhere;margin:24px 0}
.mark{font-size:clamp(20px,3vw,40px);min-height:1.3em;font-weight:bold}
#team1.winner{background:#40241f;border-color:#fb917d}
#team2.winner{background:#1d3048;border-color:#85baff}
footer{color:#999;font-size:14px;text-align:center}
[hidden]{display:none!important}
@media(max-width:600px){.teams{gap:12px}header{font-size:18px}article{padding:16px}}
#history-section{border-top:1px solid #383a49;margin-top:30px;padding:20px 0}
.history-item{border:1px solid #383a49;border-radius:12px;padding:20px;margin:12px 0;overflow-wrap:anywhere}
.history-item h3{font-size:24px;margin:0 0 12px;color:#d5c4ff}
.history-item p,.history-item li{font-size:18px;line-height:1.6}
  html,
/* Fons blau i textos blancs */
:root {
  color-scheme: light;
}

html,
body {
  background: #0077C8;
  color: #ffffff;
}

header {
  color: #ffffff;
  border-bottom: 1px solid #ffffff60;
  padding-bottom: 20px;
  flex-wrap: wrap;
}

#match-title,
#result,
#detail,
#connection,
#history-section > h2 {
  color: #ffffff;
}

#detail {
  line-height: 1.6;
}

#phase {
  color: #ffffff;
  background: #00548f;
  border: 1px solid #ffffff80;
  border-radius: 30px;
  padding: 10px 22px;
  align-self: center;
}

/* Botó de pantalla completa */
button {
  background: #ffffff;
  color: #00548f;
  border: 1px solid #ffffff;
  font-weight: 700;
}

button:hover {
  background: #e5f2fc;
}

button:focus-visible {
  outline: 3px solid #142c40;
  outline-offset: 3px;
}

/* Targetes dels equips */
.teams article {
  background: #ffffff;
  color: #142c40;
  border: 3px solid #d5e3ee;
  box-shadow: 0 12px 30px #00345430;
}

.teams article span {
  color: #40576b;
  font-weight: 700;
}

.teams article h2 {
  color: #142c40;
}

/* Equip que ha premut primer */
#team1.winner,
#team2.winner {
  background: #e2f6e9;
  border-color: #16703b;
  box-shadow: 0 0 0 5px #ffffff;
}

.mark {
  color: #125c31;
}

/* Historial */
#history-section {
  border-top: 1px solid #ffffff60;
}

.history-item {
  background: #ffffff;
  color: #142c40;
  border: 1px solid #d5e3ee;
  border-radius: 16px;
  box-shadow: 0 8px 20px #00345425;
}

.history-item h3 {
  color: #00548f;
}

.history-item p,
.history-item li {
  color: #304b60;
}

#connection {
  margin-top: 20px;
  font-size: 16px;
}

html,
body,
button,
input,
select,
textarea,
kbd {
  font-family: "Open Sans", sans-serif;
}

/* ESTIL GENERAL */
:root {
  color-scheme: light;
  font-family: "Open Sans", sans-serif;
  background: #0077c8;
}

html,
body {
  background: #0077c8;
  color: #fff;
}

body,
button,
input,
select,
textarea,
kbd {
  font-family: "Open Sans", sans-serif;
}

body {
  line-height: 1.55;
}

button,
input,
select {
  min-height: 46px;
  border-radius: 12px;
}

button {
  font-weight: 700;
  transition: background 160ms ease, transform 160ms ease;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:active:not(:disabled) {
  transform: translateY(0);
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #ffcf66;
  outline-offset: 4px;
}

button:disabled {
  background: #e5ebf0;
  color: #52616e;
  border-color: #c4d0da;
  opacity: 1;
  cursor: not-allowed;
}

header {
  gap: 18px;
  border-bottom: 1px solid #ffffff50;
}

.logo,
.logo span {
  color: #fff;
  letter-spacing: -0.6px;
}

.badge {
  padding: 9px 14px;
  background: #00548f;
  color: #fff;
  border: 1px solid #ffffff70;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

/* PANELL DE L’ORGANITZADOR */
.organitzador header,
.organitzador main {
  max-width: 1240px;
}

.organitzador main {
  padding-top: 32px;
}

.organitzador h1 {
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 800;
  letter-spacing: -1px;
}

.organitzador .layout {
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  align-items: start;
  gap: 24px;
  margin-top: 28px;
}

.panel {
  background: #fff;
  color: #142c40;
  border: 1px solid #d8e5ee;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 14px 36px #00345426;
  min-width: 0;
}

.panel h2 {
  color: #142c40;
  font-weight: 800;
  margin-bottom: 22px;
}

.panel label {
  color: #304b60;
  font-weight: 700;
}

.panel p,
.panel .subtle {
  color: #40576b;
}

input,
select {
  background: #f4f8fb;
  color: #142c40;
  border: 1px solid #8da5b8;
  padding: 13px 14px;
}

input::placeholder {
  color: #526779;
}

button.primary,
#form button,
#mqtt-connect {
  background: #00548f;
  color: #fff;
  border: 1px solid #00548f;
}

button.primary:hover:not(:disabled),
#form button:hover:not(:disabled),
#mqtt-connect:hover:not(:disabled) {
  background: #003e6b;
}

#open-public {
  background: #fff;
  color: #004b80;
  border: 1px solid #fff;
  box-shadow: 0 6px 18px #00345425;
}

#open-public:hover {
  background: #edf6fc;
}

#start {
  min-height: 54px;
  font-size: 17px;
}

#end {
  background: #fff;
  color: #52616e;
  border: 1px solid #8da5b8;
}

#end:hover {
  background: #eef3f7;
}

#teams li {
  gap: 10px;
  padding: 14px 0;
  border-bottom-color: #dce7ef;
}

#teams button,
#history-admin button {
  min-height: 36px;
  background: #fff2f3;
  color: #9c2130;
  border: 1px solid #cf98a0;
  font-size: 13px;
}

#teams button:hover,
#history-admin button:hover {
  background: #ffe0e4;
}

.organitzador .status {
  padding: 22px 0 28px;
}

.organitzador #result {
  font-size: clamp(26px, 3vw, 38px);
  font-weight: 800;
  color: #142c40;
}

#phase {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 999px;
  line-height: 1.4;
  letter-spacing: 1.2px;
}

.organitzador #phase {
  background: #e9f3fb;
  color: #00548f;
}

#placeholder {
  display: none;
}

.organitzador > .panel {
  width: calc(100% - 56px);
}

/* TARGETES DELS EQUIPS */
.buzzers,
.public .teams {
  gap: 24px;
}

.team-card,
.public .teams article {
  position: relative;
  background: #fff;
  color: #142c40;
  border: 2px solid #d5e3ee;
  border-top: 7px solid var(--equip-color);
  border-radius: 22px;
  box-shadow: 0 8px 24px #00345418;
  transition:
    transform 220ms ease,
    background 220ms ease,
    box-shadow 220ms ease;
}

#card1,
#team1 {
  --equip-color: #c55a11;
}

#card2,
#team2 {
  --equip-color: #00548f;
}

.team-card > .subtle,
.public .teams article > span {
  display: inline-block;
  color: var(--equip-color);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
}

.team-name,
.public .teams article h2 {
  color: #142c40;
  font-weight: 800;
  overflow-wrap: anywhere;
  line-height: 1.2;
}

.team-card .orb {
  width: 72px;
  height: 72px;
  background: var(--equip-color);
  border: 9px solid #e8eff4;
  box-shadow: 0 5px 12px #142c4020;
}

#buzz1,
#buzz2 {
  width: 100%;
  margin-top: 8px;
}

#buzz1:not(:disabled),
#buzz2:not(:disabled) {
  background: var(--equip-color);
  color: #fff;
  border-color: var(--equip-color);
}

/* PRIMERA PULSACIÓ */
#card1.winner,
#card2.winner,
#team1.winner,
#team2.winner {
  --equip-color: #16703b;
  background: #e8f7ed;
  border-color: #16703b;
  box-shadow: 0 0 0 4px #b9e5c8, 0 14px 32px #00345428;
  transform: translateY(-4px);
  animation: celebrar 450ms ease-out;
}

.winner.one .orb,
.winner.two .orb {
  background: #16703b;
  border-color: #b9e5c8;
}

.buzzers:has(.winner) .team-card:not(.winner),
.public .teams:has(.winner) article:not(.winner) {
  background: #eaf0f5;
  box-shadow: none;
}

.mark {
  color: #125c31;
  font-weight: 800;
  letter-spacing: 1px;
}

@keyframes celebrar {
  0% { transform: translateY(0) scale(1); }
  55% { transform: translateY(-5px) scale(1.025); }
  100% { transform: translateY(-4px) scale(1); }
}

/* HISTORIAL */
#history-admin,
#history-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 16px;
}

#history-admin > div,
.public .history-item {
  margin: 0;
  padding: 20px;
  background: #f4f8fb;
  color: #142c40;
  border: 1px solid #d5e3ee;
  border-radius: 16px;
  box-shadow: none;
}

#history-admin label {
  overflow-wrap: anywhere;
}

.public .history-item h3 {
  color: #00548f;
  font-size: 21px;
}

.public .history-item p,
.public .history-item li {
  color: #40576b;
  font-size: 15px;
}

.public .history-item ul {
  padding-left: 20px;
}

.panel .error {
  color: #a51c30;
}

/* PANTALLA DEL PÚBLIC */
body.public {
  padding: clamp(18px, 3vw, 44px);
}

.public header {
  padding-bottom: 20px;
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 800;
  color: #fff;
}

.public main {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 0;
}

.public #match-title {
  margin: 0 0 18px;
  line-height: 1.25;
}

.public #match-title:empty {
  display: none;
}

.public #phase {
  background: #00548f;
  color: #fff;
  border: 1px solid #ffffff70;
  font-size: clamp(13px, 1.4vw, 19px);
  margin: 0;
}

.public #result {
  color: #fff;
  font-size: clamp(34px, 5vw, 76px);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -1px;
  margin: 22px 0 12px;
}

.public #detail {
  color: #fff;
  font-size: clamp(16px, 1.8vw, 24px);
  margin: 0 0 12px;
}

.public .teams article {
  padding: clamp(24px, 4vw, 56px) 24px;
}

.public .teams article h2 {
  font-size: clamp(30px, 4vw, 64px);
  margin: 24px 0;
}

.public .mark {
  font-size: clamp(16px, 2vw, 28px);
  min-height: 1.6em;
}

.public #history-section {
  width: 100%;
  max-width: 1440px;
  margin: 20px auto 0;
  padding-top: 24px;
  border-top: 1px solid #ffffff50;
}

.public #history-section > h2 {
  color: #fff;
  margin: 0 0 18px;
}

#history-list > p {
  color: #fff;
}

.public #connection {
  color: #fff;
  font-size: 13px;
  margin-top: 24px;
}

#fullscreen {
  font-size: 14px;
}

/* MÒBILS I ACCESSIBILITAT */
@media (max-width: 760px) {
  .organitzador .layout {
    grid-template-columns: 1fr;
  }

  .panel {
    padding: 20px;
  }

  .organitzador > .panel {
    width: calc(100% - 36px);
  }
}

@media (max-width: 520px) {
  .selection,
  .buzzers,
  .public .teams {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-direction: column;
  }

  .public .teams article {
    padding: 24px 18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body class="public">
<header><span>Inter-Enginy Challenge 2027</span><button id="fullscreen">Pantalla completa</button></header>
<main aria-live="polite">
<p id="match-title" style="font-size:clamp(24px,3vw,40px);font-weight:bold;overflow-wrap:anywhere"></p>
<p id="phase">Pantalla del públic</p>
<h1 id="result">Esperant l’organitzador</h1>
<p id="detail">Obre aquesta pantalla des del panell de l’organitzador.</p>
<div class="teams" id="teams" hidden>
<article id="team1"><span>POLSADOR 1</span><h2 id="name1"></h2><div class="mark" id="mark1"></div></article>
<article id="team2"><span>POLSADOR 2</span><h2 id="name2"></h2><div class="mark" id="mark2"></div></article>
</div>
</main>
<section id="history-section">
<h2 style="font-size:28px">PARTIDES FINALITZADES</h2>
<div id="history-list"><p>Encara no hi ha partides finalitzades.</p></div>
</section>
<footer id="connection">Esperant connexió amb el panell…</footer>
<script src="public.js?v=historial-1"></script>
</body>
</html>
